name: Status-sync

# Enforces label/board lifecycle transitions so no actor (Claude Code,
# Copilot, GitHub UI, humans) can silently skip them. Three triggers:
#
#   1. PR opened referencing an issue via closing keywords
#      (Closes/Fixes/Resolves #N) -- swap status:draft -> status:ready,
#      add a warning comment, and move board Status: Todo -> In Progress.
#
#   2. Issue closed while still carrying status:draft -- replace with
#      status:ready and warn. Draft must never be the final label state
#      of delivered work.
#
#   3. Priority label (priority:*) added to a non-parked-idea issue that
#      still carries status:draft -- remove status:draft per the triage
#      lifecycle. Parked-idea signature (milestone + investigate) is
#      skipped; those are intentional.
#
#   4. Issue closed -- set board Status to Done. The built-in Projects
#      "Item closed" automation only fires for items already on the board
#      at the moment of the close event and can miss issues closed via the
#      API/CLI (e.g. `gh issue close`). This job sets Status: Done
#      explicitly so every close path (UI, gh, API) lands on Done -- EXCEPT
#      it holds a parent at In Review (never Done) while it still has any open
#      sub-issue, manual included (the enforced completion gate).
#
# Board Status writes (triggers 1 and 4) require a PAT with the `project`
# scope stored as the STATUS_SYNC_PAT Actions secret. If the secret is
# absent, label transitions still execute and a skip notice is logged.
# See knowledge/token-registry.md -- STATUS_SYNC_PAT for setup steps.

on:
  pull_request:
    types: [opened, ready_for_review]
  issues:
    types: [closed, labeled]

permissions:
  issues: write
  pull-requests: read

jobs:
  # ------------------------------------------------------------------
  # Job 1: PR opened -- clear status:draft and move board to In Progress
  # ------------------------------------------------------------------
  pr-linked-in-progress:
    name: PR linked issue -- clear draft + board In Progress
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Update linked issues
        env:
          STATUS_SYNC_PAT: ${{ secrets.STATUS_SYNC_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess, sys

          repo = os.environ["REPO"]
          pr_number = int(os.environ["PR_NUMBER"])
          pat = os.environ.get("STATUS_SYNC_PAT", "")
          owner, name = repo.split("/")

          # Fetch closing-issue references via GraphQL
          query = f"""
          query {{
            repository(owner: "{owner}", name: "{name}") {{
              pullRequest(number: {pr_number}) {{
                closingIssuesReferences(first: 20) {{
                  nodes {{
                    number
                    labels(first: 30) {{ nodes {{ name }} }}
                    projectItems(first: 5) {{
                      nodes {{
                        id
                        project {{ id title }}
                        fieldValueByName(name: "Status") {{
                          ... on ProjectV2ItemFieldSingleSelectValue {{
                            name optionId
                          }}
                        }}
                      }}
                    }}
                  }}
                }}
              }}
            }}
          }}
          """
          r = subprocess.run(
              ["gh", "api", "graphql", "-f", f"query={query}"],
              capture_output=True, text=True,
          )
          if r.returncode != 0:
              print(f"GraphQL error: {r.stderr}", file=sys.stderr)
              sys.exit(0)  # never block the PR

          issues = (
              json.loads(r.stdout)
              .get("data", {})
              .get("repository", {})
              .get("pullRequest", {})
              .get("closingIssuesReferences", {})
              .get("nodes", [])
          )

          for issue in issues:
              issue_num = issue["number"]
              labels = [l["name"] for l in issue["labels"]["nodes"]]
              print(f"Linked issue #{issue_num}: labels={labels}")

              # 1a. Clear status:draft -> status:ready
              if "status:draft" in labels:
                  subprocess.run(
                      ["gh", "issue", "edit", str(issue_num),
                       "--repo", repo,
                       "--remove-label", "status:draft",
                       "--add-label", "status:ready"],
                      check=False,
                  )
                  subprocess.run(
                      ["gh", "issue", "comment", str(issue_num),
                       "--repo", repo,
                       "--body",
                       f"PR #{pr_number} references this issue. "
                       "Promoted from `status:draft` to `status:ready` automatically."],
                      check=False,
                  )
                  print(f"  #{issue_num}: status:draft -> status:ready")

              # 1b. Board Status: Todo -> In Progress (requires STATUS_SYNC_PAT)
              if not pat:
                  print(
                      f"  #{issue_num}: STATUS_SYNC_PAT secret not configured -- "
                      "board status update skipped. "
                      "See knowledge/token-registry.md (STATUS_SYNC_PAT) to activate."
                  )
                  continue

              for item in issue.get("projectItems", {}).get("nodes", []):
                  status_val = item.get("fieldValueByName") or {}
                  if status_val.get("name") != "Todo":
                      continue
                  item_id = item["id"]
                  project_id = item["project"]["id"]

                  # Discover Status field and In Progress option ID
                  field_q = f"""
                  query {{
                    node(id: "{project_id}") {{
                      ... on ProjectV2 {{
                        fields(first: 20) {{
                          nodes {{
                            ... on ProjectV2SingleSelectField {{
                              id name
                              options {{ id name }}
                            }}
                          }}
                        }}
                      }}
                    }}
                  }}
                  """
                  fr = subprocess.run(
                      ["gh", "api", "graphql",
                       "-H", f"Authorization: token {pat}",
                       "-f", f"query={field_q}"],
                      capture_output=True, text=True,
                  )
                  if fr.returncode != 0:
                      print(f"  Field query failed: {fr.stderr}", file=sys.stderr)
                      continue
                  fields = (
                      json.loads(fr.stdout)
                      .get("data", {})
                      .get("node", {})
                      .get("fields", {})
                      .get("nodes", [])
                  )
                  status_field = next(
                      (f for f in fields if f.get("name") == "Status"), None
                  )
                  if not status_field:
                      continue
                  in_progress_opt = next(
                      (o for o in status_field.get("options", [])
                       if o["name"] == "In Progress"),
                      None,
                  )
                  if not in_progress_opt:
                      continue

                  mutation = f"""
                  mutation {{
                    updateProjectV2ItemFieldValue(input: {{
                      projectId: "{project_id}"
                      itemId: "{item_id}"
                      fieldId: "{status_field['id']}"
                      value: {{ singleSelectOptionId: "{in_progress_opt['id']}" }}
                    }}) {{ projectV2Item {{ id }} }}
                  }}
                  """
                  mr = subprocess.run(
                      ["gh", "api", "graphql",
                       "-H", f"Authorization: token {pat}",
                       "-f", f"query={mutation}"],
                      capture_output=True, text=True,
                  )
                  if mr.returncode == 0:
                      print(f"  #{issue_num}: board Status -> In Progress")
                  else:
                      print(f"  #{issue_num}: board update failed: {mr.stderr}",
                            file=sys.stderr)
          PYEOF

  # ------------------------------------------------------------------
  # Job 2: Issue closed while status:draft -- replace with status:ready
  # ------------------------------------------------------------------
  issue-closed-draft-cleanup:
    name: Issue closed -- clear status:draft
    if: github.event_name == 'issues' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Remove status:draft from closed issue
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_LABELS: ${{ toJson(github.event.issue.labels) }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess, sys

          repo = os.environ["REPO"]
          issue_num = os.environ["ISSUE_NUMBER"]
          labels = [l["name"] for l in json.loads(os.environ["ISSUE_LABELS"])]

          if "status:draft" not in labels:
              print("No status:draft -- nothing to do.")
              sys.exit(0)

          subprocess.run(
              ["gh", "issue", "edit", issue_num,
               "--repo", repo,
               "--remove-label", "status:draft",
               "--add-label", "status:ready"],
              check=False,
          )
          subprocess.run(
              ["gh", "issue", "comment", issue_num,
               "--repo", repo,
               "--body",
               "**Status cleanup:** Issue closed while still labeled `status:draft`. "
               "Replaced with `status:ready` -- draft must never be the final label "
               "state of delivered work."],
              check=False,
          )
          print(f"Issue #{issue_num}: status:draft -> status:ready on close")
          PYEOF

  # ------------------------------------------------------------------
  # Job 3: Priority label added -- clear status:draft (non-parked ideas)
  # ------------------------------------------------------------------
  priority-label-draft-cleanup:
    name: Priority label added -- clear status:draft
    if: |
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      startsWith(github.event.label.name, 'priority:')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Remove status:draft when priority added to non-parked issue
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_LABELS: ${{ toJson(github.event.issue.labels) }}
          ISSUE_MILESTONE: ${{ toJson(github.event.issue.milestone) }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess, sys

          repo = os.environ["REPO"]
          issue_num = os.environ["ISSUE_NUMBER"]
          labels = [l["name"] for l in json.loads(os.environ["ISSUE_LABELS"])]
          milestone_raw = os.environ.get("ISSUE_MILESTONE", "null")
          milestone = json.loads(milestone_raw) if milestone_raw and milestone_raw != "null" else None
          has_milestone = bool(milestone and milestone.get("title"))

          if "status:draft" not in labels:
              print("No status:draft -- nothing to do.")
              sys.exit(0)

          # Parked-idea signature: milestone + investigate label.
          # If this matches, a human is intentionally promoting a parked idea;
          # skip the auto-clear so the promotion stays deliberate.
          is_parked_idea = has_milestone and "investigate" in labels
          if is_parked_idea:
              print(
                  f"Issue #{issue_num} matches parked-idea signature "
                  "(milestone + investigate label). Skipping auto-clear -- "
                  "human is intentionally promoting."
              )
              sys.exit(0)

          subprocess.run(
              ["gh", "issue", "edit", issue_num,
               "--repo", repo,
               "--remove-label", "status:draft"],
              check=False,
          )
          subprocess.run(
              ["gh", "issue", "comment", issue_num,
               "--repo", repo,
               "--body",
               "**Status cleanup:** Priority label added -- `status:draft` removed "
               "per triage lifecycle. The issue is untriaged (no status label). "
               "Add `status:ready` when it is ready to execute."],
              check=False,
          )
          print(f"Issue #{issue_num}: status:draft removed after priority label added")
          PYEOF

  # ------------------------------------------------------------------
  # Job 4: Issue closed -- set board Status to Done (requires STATUS_SYNC_PAT)
  # ------------------------------------------------------------------
  issue-closed-board-done:
    name: Issue closed -- board Status Done
    if: github.event_name == 'issues' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Set board Status to Done for closed issue
        env:
          STATUS_SYNC_PAT: ${{ secrets.STATUS_SYNC_PAT }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess, sys

          repo = os.environ["REPO"]
          issue_num = int(os.environ["ISSUE_NUMBER"])
          pat = os.environ.get("STATUS_SYNC_PAT", "")
          owner, name = repo.split("/")

          if not pat:
              print(
                  "STATUS_SYNC_PAT secret not configured -- board status update "
                  "skipped. See knowledge/token-registry.md (STATUS_SYNC_PAT)."
              )
              sys.exit(0)

          # Find the closed issue's project items and their current Status.
          query = f"""
          query {{
            repository(owner: "{owner}", name: "{name}") {{
              issue(number: {issue_num}) {{
                projectItems(first: 10) {{
                  nodes {{
                    id
                    project {{ id title }}
                    fieldValueByName(name: "Status") {{
                      ... on ProjectV2ItemFieldSingleSelectValue {{ name }}
                    }}
                  }}
                }}
              }}
            }}
          }}
          """
          r = subprocess.run(
              ["gh", "api", "graphql",
               "-H", f"Authorization: token {pat}",
               "-f", f"query={query}"],
              capture_output=True, text=True,
          )
          if r.returncode != 0:
              print(f"GraphQL error: {r.stderr}", file=sys.stderr)
              sys.exit(0)  # never block the close

          items = (
              json.loads(r.stdout)
              .get("data", {})
              .get("repository", {})
              .get("issue", {})
              .get("projectItems", {})
              .get("nodes", [])
          )
          if not items:
              print(
                  f"Issue #{issue_num} is not on any project board -- nothing to do. "
                  "(Automation only acts on items already on a board at close time.)"
              )
              sys.exit(0)

          # Enforced completion gate. Never set a parent to Done while it has
          # ANY open sub-issue, manual included; hold it at In Review instead
          # (an open sub-issue never blocks the feature PR merge, but it does
          # block the parent reaching Done). This workflow fires AFTER the close
          # and cannot veto it, so it only corrects the board; reopening a
          # wrongly-closed parent is the daily reconciler's job. Manual-execution
          # children -- carrying the additive `manual` label -- count toward this
          # hold like any other open child.
          sr = subprocess.run(
              ["gh", "api", f"repos/{owner}/{name}/issues/{issue_num}/sub_issues",
               "-H", f"Authorization: token {pat}",
               "--jq", "[.[] | {number, state, title, labels: [.labels[].name]}]"],
              capture_output=True, text=True,
          )
          open_children = []
          if sr.returncode != 0:
              # Could not determine children -- warn (do not silently bypass the
              # gate). The reconciler backstop will catch a wrongly-Done parent.
              print(f"  WARN #{issue_num}: sub_issues query failed "
                    f"({sr.stderr.strip()[:120]}); completion gate not applied.")
          elif sr.stdout.strip() not in ("", "null"):
              try:
                  for c in json.loads(sr.stdout):
                      if (c.get("state") or "").lower() == "open":
                          open_children.append(c["number"])
              except json.JSONDecodeError:
                  pass
          target_name = "In Review" if open_children else "Done"
          if open_children:
              print(f"  #{issue_num}: HELD at In Review -- open sub-issues: "
                    f"{', '.join(f'#{n}' for n in open_children)} "
                    f"(completion gate).")

          for item in items:
              status_val = item.get("fieldValueByName") or {}
              if status_val.get("name") == target_name:
                  print(f"  #{issue_num}: already {target_name} -- skipping.")
                  continue
              item_id = item["id"]
              project_id = item["project"]["id"]

              # Discover Status field and Done option ID for this project.
              field_q = f"""
              query {{
                node(id: "{project_id}") {{
                  ... on ProjectV2 {{
                    fields(first: 20) {{
                      nodes {{
                        ... on ProjectV2SingleSelectField {{
                          id name
                          options {{ id name }}
                        }}
                      }}
                    }}
                  }}
                }}
              }}
              """
              fr = subprocess.run(
                  ["gh", "api", "graphql",
                   "-H", f"Authorization: token {pat}",
                   "-f", f"query={field_q}"],
                  capture_output=True, text=True,
              )
              if fr.returncode != 0:
                  print(f"  Field query failed: {fr.stderr}", file=sys.stderr)
                  continue
              fields = (
                  json.loads(fr.stdout)
                  .get("data", {})
                  .get("node", {})
                  .get("fields", {})
                  .get("nodes", [])
              )
              status_field = next(
                  (f for f in fields if f.get("name") == "Status"), None
              )
              if not status_field:
                  continue
              target_opt = next(
                  (o for o in status_field.get("options", [])
                   if o["name"] == target_name),
                  None,
              )
              if not target_opt:
                  print(f"  No '{target_name}' option on Status field -- skipping.")
                  continue

              mutation = f"""
              mutation {{
                updateProjectV2ItemFieldValue(input: {{
                  projectId: "{project_id}"
                  itemId: "{item_id}"
                  fieldId: "{status_field['id']}"
                  value: {{ singleSelectOptionId: "{target_opt['id']}" }}
                }}) {{ projectV2Item {{ id }} }}
              }}
              """
              mr = subprocess.run(
                  ["gh", "api", "graphql",
                   "-H", f"Authorization: token {pat}",
                   "-f", f"query={mutation}"],
                  capture_output=True, text=True,
              )
              if mr.returncode == 0:
                  print(f"  #{issue_num}: board Status -> {target_name}")
              else:
                  print(f"  #{issue_num}: board update failed: {mr.stderr}",
                        file=sys.stderr)
          PYEOF

  # ------------------------------------------------------------------
  # Job 5: Child closed -- auto-close the PARENT when the completion gate's
  #        forward direction passes. Job 4 sets the CLOSING issue's own board
  #        Status; this job looks the other way -- it resolves the closing
  #        issue's PARENT and evaluates the five-condition close predicate:
  #          1. every sub-issue closed (manual included)
  #          2. no unchecked "- [ ]" in the parent body
  #          3. no open PR from a TRUSTED head referencing the parent (closing
  #             keyword; trusted = same-repo, or cross-repo author with push
  #             access -- an unqualified lookup lets a fork PR forge a hold)
  #          4. no open blocked-by dependency
  #          5. no `needs-answer` marker label on the parent
  #        Predicate passes -> close the parent and set board Done. Predicate
  #        fails -> hold the parent at In Review and maintain ONE sticky comment
  #        naming every failed condition and notifying the assignee. A failed
  #        query is indeterminate -> hold, never close on incomplete data. The
  #        board write needs STATUS_SYNC_PAT; without it the issue close still
  #        happens and the board write is skipped with a WARN. Never fails the
  #        originating close event. Self-contained at RUNTIME -- no checkout and
  #        no repo scripts required.
  #
  #        The predicate itself is GENERATED, not hand-written here: the region
  #        between the `acx:inline-predicate` BEGIN/END markers below is rendered
  #        from skills/github/scripts/close_predicate.py (the single predicate
  #        implementation, also used by the repo-own job and the reconciler) by
  #        tooling/sync-inline-predicate.py, whose --check mode fails CI on drift.
  #        Never hand-edit that region -- change close_predicate.py and re-render.
  # ------------------------------------------------------------------
  parent-auto-close:
    name: Child closed -- auto-close parent when predicate passes
    if: github.event_name == 'issues' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve parent and evaluate the close predicate
        env:
          STATUS_SYNC_PAT: ${{ secrets.STATUS_SYNC_PAT }}
          CLOSING_ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import os, sys

          # --- BEGIN acx:inline-predicate -- GENERATED from skills/github/scripts/close_predicate.py; do not hand-edit (tooling/sync-inline-predicate.py)
          import json
          import re
          import subprocess
          import sys
          from typing import List, Tuple

          UNCHECKED_BOX_RE = re.compile(r"^\s*[-*]\s+\[ \]", re.MULTILINE)
          # A closing keyword followed by ONE OR MORE "#N", comma-separated, so a body
          # written "Closes #10, #11, #12" (one keyword, comma list) is fully detected --
          # not just the first number (the pr-body-closing-keyword footgun). Each "#N" in
          # the captured list is then extracted separately.
          CLOSING_LIST_RE = re.compile(
              r"(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+((?:#\d+(?:\s*,\s*)?)+)",
              re.IGNORECASE)
          NEEDS_ANSWER_LABEL = "needs-answer"


          def closing_numbers(text: str) -> set:
              """Issue numbers a PR/commit body closes, incl. comma-separated lists."""
              nums = set()
              for m in CLOSING_LIST_RE.finditer(text or ""):
                  nums.update(int(n) for n in re.findall(r"#(\d+)", m.group(1)))
              return nums


          def _gh_json(args: List[str]):
              """Run a `gh` call and parse JSON stdout. Returns (value, error_string).

              On non-zero exit or unparsable output, value is None and error_string is set.
              An empty stdout parses to an empty list (the common `gh api ... --jq '[...]'`
              shape when there are no rows).
              """
              r = subprocess.run(["gh"] + args, capture_output=True, text=True)
              if r.returncode != 0:
                  return None, (r.stderr or "").strip()
              out = (r.stdout or "").strip()
              if not out:
                  return [], None
              try:
                  return json.loads(out), None
              except json.JSONDecodeError as exc:
                  return None, str(exc)


          def _same_repo_head(pr: dict, repo: str) -> bool:
              """True when the PR's head branch lives in ``repo`` itself.

              A same-repo head can only be pushed by someone who already has write
              access, so it needs no further probe. A head whose repo is absent (a fork
              deleted after the PR was opened) is treated as cross-repo -- unknown
              provenance is never read as trusted.
              """
              head_repo = (((pr.get("head") or {}).get("repo") or {}).get("full_name")
                           or "")
              return head_repo.lower() == repo.lower()


          def _has_push_access(repo: str, login: str) -> Tuple[bool, bool]:
              """``(has_push, indeterminate)`` for ``login`` on ``repo``.

              Uses the collaborator PERMISSION endpoint, which answers for any user
              (``none`` for a stranger), rather than the bare collaborator check, which
              also answers 204 for a read-only collaborator and would over-trust them.

              Any failed or unparsable probe is INDETERMINATE, never "no push access":
              reading an outage as untrusted would silently drop a legitimate hold and
              close a parent early, the exact direction this predicate must not fail in.
              """
              perm, _err = _gh_json(
                  ["api", "repos/{0}/collaborators/{1}/permission".format(repo, login)],
              )
              if not isinstance(perm, dict):
                  return False, True
              role = (perm.get("role_name") or perm.get("permission") or "").lower()
              return role in ("admin", "maintain", "write"), False


          def evaluate(repo: str, parent: int) -> Tuple[bool, List[str], bool, List[str]]:
              """Evaluate the close predicate on ``parent`` in ``repo``.

              Returns (passes, failures, indeterminate, assignees):
                * passes        -- True only when all five conditions hold.
                * failures       -- one human-readable line per FAILED condition, for the
                                    hold comment.
                * indeterminate -- True when a required query failed; the caller must HOLD
                                    and NOT close (never close on incomplete data).
                * assignees      -- the parent's assignee logins (for the hold notification).
              """
              failures: List[str] = []
              assignees: List[str] = []

              # C1: every sub-issue closed. A failed query is indeterminate -- we cannot
              # know whether children remain open, so we must not close.
              # --paginate (no --jq) so a parent with more than one page of sub-issues
              # (>30) is fully seen -- with --jq, gh applies the filter per page and
              # concatenates raw text rather than merging the array, which would hide
              # open children on later pages and false-pass condition 1.
              subs, err = _gh_json(
                  ["api", "--paginate",
                   "repos/{0}/issues/{1}/sub_issues".format(repo, parent)],
              )
              if subs is None:
                  return False, ["could not query sub-issues ({0})".format(err[:120])], True, assignees
              open_children = [c["number"] for c in subs
                               if (c.get("state") or "").lower() == "open"]
              if open_children:
                  failures.append("open sub-issue(s): "
                                  + ", ".join("#{0}".format(n) for n in open_children))

              # C2 + C5: read the parent once for body, labels, assignees.
              parent_obj, err = _gh_json(
                  ["issue", "view", str(parent), "--repo", repo,
                   "--json", "body,labels,assignees"],
              )
              if parent_obj is None or not isinstance(parent_obj, dict):
                  return False, ["could not read parent #{0} ({1})".format(parent, (err or "")[:120])], True, assignees
              assignees = [a["login"] for a in parent_obj.get("assignees", [])]

              body = parent_obj.get("body") or ""
              unchecked = UNCHECKED_BOX_RE.findall(body)
              if unchecked:
                  failures.append("{0} unchecked acceptance-criteria checkbox(es) in the body"
                                  .format(len(unchecked)))

              labels = [lbl["name"] for lbl in parent_obj.get("labels", [])]
              if NEEDS_ANSWER_LABEL in labels:
                  failures.append("`needs-answer` is set (an unresolved question)")

              # C3: no OPEN PR from a TRUSTED head referencing the parent via a closing
              # keyword. An unqualified reverse lookup is forgeable: on a public repo
              # anyone who can open a fork PR could hold any parent open indefinitely by
              # writing "closes #<parent>" in its body.
              #
              # --paginate over the REST pulls list rather than `gh pr list --limit N`:
              # any limit is a truncation, and a repo with more open PRs than the cap
              # would silently MISS a referencing PR and close the parent early -- the
              # opposite failure direction, and the one that loses data. As in C1, no
              # --jq: with a filter gh applies it per page and concatenates raw text
              # instead of merging the array.
              prs, err = _gh_json(
                  ["api", "--paginate",
                   "repos/{0}/pulls?state=open&per_page=100".format(repo)],
              )
              if prs is None:
                  return False, ["could not list open PRs ({0})".format((err or "")[:120])], True, assignees
              holding: List[int] = []
              untrusted: List[int] = []
              probed = {}  # login -> (has_push, probe_failed); one probe per author
              referencing = [pr for pr in prs
                             if parent in closing_numbers(pr.get("body") or "")]
              for pr in sorted(referencing, key=lambda p: p.get("number") or 0):
                  number = pr.get("number")
                  if _same_repo_head(pr, repo):
                      holding.append(number)
                      continue
                  login = ((pr.get("user") or {}).get("login") or "")
                  if not login:
                      return False, [
                          "could not identify the author of cross-repo PR #{0}".format(number)
                      ], True, assignees
                  if login not in probed:
                      probed[login] = _has_push_access(repo, login)
                  has_push, probe_failed = probed[login]
                  if probe_failed:
                      return False, [
                          "could not verify push access for @{0} on cross-repo PR #{1}"
                          .format(login, number)
                      ], True, assignees
                  (holding if has_push else untrusted).append(number)
              if untrusted:
                  # Never silently dropped: logged on every run, and named in the hold
                  # comment below whenever some other condition holds the parent anyway.
                  print("close_predicate: not counting untrusted-head PR(s) toward the "
                        "hold on #{0}: {1}".format(
                            parent, ", ".join("#{0}".format(n) for n in untrusted)),
                        file=sys.stderr)
              if holding:
                  failures.append("open PR(s) referencing this parent: "
                                  + ", ".join("#{0}".format(n) for n in holding))

              # C4: no OPEN blocked-by dependency. The endpoint returns [] cleanly when a
              # repo has no dependencies, so a non-zero result is a real failure -> hold.
              blockers, err = _gh_json(
                  ["api", "repos/{0}/issues/{1}/dependencies/blocked_by".format(repo, parent),
                   "--jq", "[.[] | {number, state}]"],
              )
              if blockers is None:
                  return False, ["could not query blocked-by dependencies ({0})".format((err or "")[:120])], True, assignees
              open_blockers = [b["number"] for b in blockers
                               if (b.get("state") or "").lower() == "open"]
              if open_blockers:
                  failures.append("open blocked-by dependency: "
                                  + ", ".join("#{0}".format(n) for n in open_blockers))

              # An untrusted referencing PR never holds the parent on its own, but when
              # the parent is held anyway the reader deserves to know it was seen and
              # deliberately discounted -- otherwise the hold comment reads as if no such
              # PR exists.
              if untrusted and failures:
                  failures.append(
                      "(not counted -- untrusted head) open PR(s) referencing this parent: "
                      + ", ".join("#{0}".format(n) for n in untrusted))

              return (len(failures) == 0), failures, False, assignees
          # --- END acx:inline-predicate

          repo = os.environ["REPO"]
          closing = int(os.environ["CLOSING_ISSUE"])
          pat = os.environ.get("STATUS_SYNC_PAT", "")
          owner, name = repo.split("/")
          HOLD_MARKER = "<!-- acx:parent-auto-close-hold -->"

          def gh(args, token=None):
              env = dict(os.environ)
              if token:
                  env["GH_TOKEN"] = token
              return subprocess.run(["gh"] + args, capture_output=True,
                                    text=True, env=env)

          # 1. Resolve the closing issue's parent (+ its project items and Status).
          q = f"""
          query {{
            repository(owner: "{owner}", name: "{name}") {{
              issue(number: {closing}) {{
                parent {{
                  number
                  state
                  projectItems(first: 10) {{
                    nodes {{
                      id
                      project {{ id title }}
                      fieldValueByName(name: "Status") {{
                        ... on ProjectV2ItemFieldSingleSelectValue {{ name }}
                      }}
                    }}
                  }}
                }}
              }}
            }}
          }}
          """
          r = gh(["api", "graphql", "-f", f"query={q}"])
          if r.returncode != 0:
              print(f"GraphQL error resolving parent: {r.stderr}", file=sys.stderr)
              sys.exit(0)  # never block the close
          try:
              data = json.loads(r.stdout)
          except (json.JSONDecodeError, ValueError):
              print("Could not parse parent lookup response -- skipping.", file=sys.stderr)
              sys.exit(0)
          parent = (data.get("data", {}).get("repository", {})
                    .get("issue", {}) or {}).get("parent")
          if not parent:
              print(f"#{closing} has no parent -- nothing to auto-close.")
              sys.exit(0)
          pn = parent["number"]
          if (parent.get("state") or "").lower() == "closed":
              print(f"Parent #{pn} already closed -- nothing to do.")
              sys.exit(0)

          # 2. Evaluate the five-condition close predicate on the parent, via
          #    the generated `evaluate` above -- the same code path (and the
          #    same failure-list text) as the repo-own job and the reconciler.
          passes, failures, indeterminate, assignees = evaluate(repo, pn)

          # 3. Sticky comment helpers (ONE comment per parent, updated in place).
          def find_hold():
              # --paginate WITHOUT --jq so gh merges all comment pages into one
              # array; match the marker AND require the Actions bot as author so
              # a forged comment carrying the public marker cannot be adopted.
              cr = gh(["api", "--paginate",
                       f"repos/{owner}/{name}/issues/{pn}/comments"])
              if cr.returncode != 0 or not cr.stdout.strip():
                  return None
              try:
                  comments = json.loads(cr.stdout)
              except json.JSONDecodeError:
                  return None
              for c in comments:
                  login = (c.get("user") or {}).get("login", "")
                  if HOLD_MARKER in (c.get("body") or "") and login == "github-actions[bot]":
                      return c
              return None

          def upsert_hold(body):
              existing = find_hold()
              full = HOLD_MARKER + "\n" + body
              if existing:
                  gh(["api", "--method", "PATCH",
                      f"repos/{owner}/{name}/issues/comments/{existing['id']}",
                      "-f", f"body={full}"])
              else:
                  gh(["issue", "comment", str(pn), "--repo", repo, "--body", full])

          def set_board(target_name):
              if not pat:
                  print(f"  #{pn}: STATUS_SYNC_PAT absent -- board write to "
                        f"{target_name} skipped (WARN).")
                  return
              for item in parent.get("projectItems", {}).get("nodes", []):
                  if (item.get("fieldValueByName") or {}).get("name") == target_name:
                      continue
                  project_id = item["project"]["id"]
                  fq = f"""
                  query {{ node(id: "{project_id}") {{ ... on ProjectV2 {{
                    fields(first: 20) {{ nodes {{ ... on ProjectV2SingleSelectField {{
                      id name options {{ id name }} }} }} }} }} }} }}
                  """
                  fr = gh(["api", "graphql", "-f", f"query={fq}"], token=pat)
                  if fr.returncode != 0:
                      print(f"  Field query failed: {fr.stderr}", file=sys.stderr)
                      continue
                  fields = (json.loads(fr.stdout).get("data", {}).get("node", {})
                            .get("fields", {}).get("nodes", []))
                  sf = next((f for f in fields if f.get("name") == "Status"), None)
                  if not sf:
                      continue
                  opt = next((o for o in sf.get("options", [])
                              if o["name"] == target_name), None)
                  if not opt:
                      print(f"  No '{target_name}' option -- skipping.")
                      continue
                  mut = f"""
                  mutation {{ updateProjectV2ItemFieldValue(input: {{
                    projectId: "{project_id}" itemId: "{item['id']}"
                    fieldId: "{sf['id']}"
                    value: {{ singleSelectOptionId: "{opt['id']}" }}
                  }}) {{ projectV2Item {{ id }} }} }}
                  """
                  mr = gh(["api", "graphql", "-f", f"query={mut}"], token=pat)
                  if mr.returncode == 0:
                      print(f"  #{pn}: board Status -> {target_name}")
                  else:
                      print(f"  #{pn}: board update failed: {mr.stderr}", file=sys.stderr)

          # 4. Act on the verdict.
          if indeterminate:
              upsert_hold(f"**Parent auto-close held** on #{pn}. The close predicate "
                          "could not be fully evaluated (a query failed); the parent "
                          "is held rather than closed on incomplete data.\n\nReason(s):\n"
                          + "\n".join(f"- {f}" for f in failures))
              print(f"  #{pn}: INDETERMINATE -- held, not closed.")
              sys.exit(0)

          if not passes:
              mentions = " ".join(f"@{a}" for a in assignees) if assignees \
                  else "_(parent is unassigned -- owner action needed)_"
              upsert_hold(f"**Parent auto-close held** on #{pn}: the completion gate's "
                          "forward direction is blocked. This parent stays at "
                          "`In Review` and open until every condition below clears.\n\n"
                          "Blocking condition(s):\n"
                          + "\n".join(f"- {f}" for f in failures)
                          + f"\n\n{mentions}")
              set_board("In Review")
              print(f"  #{pn}: HELD -- {len(failures)} blocking condition(s).")
              sys.exit(0)

          existing = find_hold()
          if existing:
              gh(["api", "--method", "PATCH",
                  f"repos/{owner}/{name}/issues/comments/{existing['id']}",
                  "-f", f"body={HOLD_MARKER}\n**Hold cleared.** All close-predicate "
                  "conditions now pass; closing the parent."])
          cr = gh(["issue", "close", str(pn), "--repo", repo, "--comment",
                   f"Auto-closed: every sub-issue is closed and the completion-gate "
                   f"close predicate passes (triggered by #{closing} closing)."])
          if cr.returncode == 0:
              print(f"  #{pn}: auto-closed (predicate passed).")
              set_board("Done")
          else:
              print(f"  #{pn}: close failed: {cr.stderr}", file=sys.stderr)
          PYEOF
