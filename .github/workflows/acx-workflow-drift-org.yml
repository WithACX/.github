# acx-workflow-drift-org.yml (#2949, ADR-0101 D1/D2) -- ORG-CENTRAL drift sweep.
#
# Belongs in withACX/.github at .github/workflows/acx-workflow-drift-org.yml.
# `/setup-repo` installs A-CX's event-driven workflows and their helpers into
# each opted-in repo as ordinary files; ADR-0101 D1/D2 keep those copies current
# with a drift check. This is that check's scheduled caller. Every input is
# reachable through the API, so it runs once here over the managed-repo list
# rather than per repo (ADR-0101 routing).
#
# THE COMPARISON IS NOT RE-IMPLEMENTED HERE. The sweep script fetches each
# repo's installed copies and runs a-cx-ai-config's
# `skills/skill-lifecycle/scripts/check_workflow_drift.py` against them, which
# also supplies the list of tracked paths. The source assets it compares against
# are the same checkout, so a copy is judged against what `/setup-repo` would
# install today.
#
# THE a-cx-ai-config CHECKOUT REF IS UNPINNED on the same terms
# acx-estimate-check-org.yml records (ADR-0107 D3): it executes the default
# branch's check_workflow_drift.py with the sweep's token in the environment.
#
# TOKEN: ORG_ESTIMATE_CHECK_TOKEN, reused (Contents: Read on all withACX repos,
# ADR-0107). This sweep only reads. Without the secret the workflow is inert: it
# logs a notice and exits 0.
name: acx workflow drift (org-central)

on:
  schedule:
    # Mondays at 07:00 UTC, clear of the Tuesday estimate sweep on the same token.
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: acx-workflow-drift-org
  cancel-in-progress: false

jobs:
  sweep:
    name: Compare installed A-CX workflow copies against their source assets
    runs-on: ubuntu-latest
    steps:
      - name: Check for the org-scoped token
        id: guard
        env:
          ORG_ESTIMATE_CHECK_TOKEN: ${{ secrets.ORG_ESTIMATE_CHECK_TOKEN }}
        run: |
          if [ -z "${ORG_ESTIMATE_CHECK_TOKEN}" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ORG_ESTIMATE_CHECK_TOKEN not set -- the org-central workflow drift sweep is inert. See knowledge/token-registry.md in a-cx-ai-config."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout withACX/.github (selector helper + sweep script)
        if: steps.guard.outputs.has_token == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout a-cx-ai-config (drift check + source assets, never a copy)
        if: steps.guard.outputs.has_token == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: withACX/a-cx-ai-config
          path: _acx-config
          token: ${{ secrets.ORG_ESTIMATE_CHECK_TOKEN }}
          persist-credentials: false

      - name: Resolve the A-CX-managed repo list
        id: select
        if: steps.guard.outputs.has_token == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.ORG_ESTIMATE_CHECK_TOKEN }}
          script: |
            const fs = require("fs");
            const path = require("path");
            const { selectManagedRepos } =
              require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/acx-select-managed-repos.js`);
            const targets = await selectManagedRepos({ github, core });
            const out = path.join(process.env.RUNNER_TEMP, "acx-drift-targets.json");
            fs.writeFileSync(out, JSON.stringify(targets), "utf8");
            core.info(
              `workflow-drift scope: ${targets.map((t) => t.repo).join(", ") || "(none)"}`
            );
            core.setOutput("targets_file", out);

      - name: Sweep each managed repo for drifted workflow copies
        if: steps.guard.outputs.has_token == 'true'
        env:
          GH_TOKEN: ${{ secrets.ORG_ESTIMATE_CHECK_TOKEN }}
          ACX_TARGETS_FILE: ${{ steps.select.outputs.targets_file }}
          ACX_DRIFT_CHECK: _acx-config/skills/skill-lifecycle/scripts/check_workflow_drift.py
          ACX_GITHUB_SCRIPTS: _acx-config/skills/github/scripts
        run: python3 .github/scripts/acx-workflow-drift-sweep.py
